<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin.css"><title>Products — Valley Crown Admin</title></head><body class="admin-body" data-admin-page="products"><div class="admin-shell"><div class="admin-mobile-bar"><button class="admin-menu-btn" data-admin-menu aria-label="Open admin menu">☰</button><div class="wordmark">VALLEY CROWN</div><a href="/" aria-label="Storefront">↗</a></div>
<div class="admin-overlay" data-admin-overlay></div>
<aside class="admin-sidebar" data-admin-sidebar>
  <div class="admin-brand"><div class="wordmark">VALLEY CROWN</div><div class="admin-kicker">Admin Control Centre</div></div>
  <nav class="admin-nav">
    <a data-nav="dashboard" href="/admin/index.html">Dashboard</a>
    <a data-nav="products" href="/admin/products.html">Products</a>
    <a data-nav="categories" href="/admin/categories.html">Categories</a>
    <a data-nav="orders" href="/admin/orders.html">Orders</a>
    <a data-nav="settings" href="/admin/settings.html">Settings</a>
    <a href="/">Storefront ↗</a>
  </nav>
  <div class="admin-sidebar__bottom"><button class="admin-btn admin-btn--secondary" data-logout>Sign out</button></div>
</aside>
<main class="admin-main"><div class="admin-top"><div><span class="eyebrow" style="color:#d8c99e">CATALOGUE</span><h1 class="admin-title">Products.</h1></div><button class="admin-btn" data-new-product>Add product</button></div><div class="admin-card"><div class="admin-toolbar"><div class="admin-toolbar__group"><input class="admin-input" data-product-search placeholder="Search products" style="max-width:280px"><select class="admin-select" data-product-filter style="width:auto"><option value="all">All status</option><option value="active">Active</option><option value="inactive">Inactive</option></select></div><span class="admin-mini" data-product-count></span></div><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Product</th><th>Price</th><th>Stock</th><th>Status</th><th>Flags</th><th>Actions</th></tr></thead><tbody data-products-list><tr><td colspan="6">Loading…</td></tr></tbody></table></div></div></main><div class="admin-modal hide" data-product-modal><div class="admin-modal__panel"><div class="admin-modal__head"><div><div class="admin-kicker">Catalogue</div><h2 data-product-modal-title style="font-size:34px">Add product</h2></div><button class="admin-close" type="button" data-close-product>×</button></div><form data-product-form><input type="hidden" name="id"><div class="admin-form-grid"><div class="admin-field"><label>Name</label><input class="admin-input" name="name" required></div><div class="admin-field"><label>Slug</label><input class="admin-input" name="slug" required></div><div class="admin-field"><label>Category</label><select class="admin-select" name="category_id" data-category-options><option value="">No category</option></select></div><div class="admin-field"><label>SKU</label><input class="admin-input" name="sku"></div><div class="admin-field"><label>Price (₹)</label><input class="admin-input" type="number" min="0" step="0.01" name="price" required></div><div class="admin-field"><label>Sale price (₹)</label><input class="admin-input" type="number" min="0" step="0.01" name="sale_price"></div><div class="admin-field"><label>Stock</label><input class="admin-input" type="number" min="0" step="1" name="stock" required value="0"></div><div class="admin-field"><label>Material</label><input class="admin-input" name="material"></div><div class="admin-field"><label>Sizes (comma separated)</label><input class="admin-input" name="sizes" placeholder="S, M, L, XL"></div><div class="admin-field"><label>Colors (comma separated)</label><input class="admin-input" name="colors" placeholder="Black, Ivory"></div><div class="admin-field admin-field--full"><label>Short description</label><input class="admin-input" name="short_description"></div><div class="admin-field admin-field--full"><label>Description</label><textarea class="admin-textarea" name="description"></textarea></div><div class="admin-field"><label>Status</label><select class="admin-select" name="status"><option value="active">Active</option><option value="inactive">Inactive</option></select></div><div class="admin-field"><label>Images (max 8, JPG/PNG/WebP, max 5MB each)</label><input class="admin-input" type="file" name="images" accept="image/jpeg,image/png,image/webp" multiple></div><div class="admin-field admin-field--full"><div class="admin-checks"><label class="admin-check"><input type="checkbox" name="featured"> Featured</label><label class="admin-check"><input type="checkbox" name="new_arrival"> New arrival</label><label class="admin-check"><input type="checkbox" name="bestseller"> Bestseller</label></div></div><div class="admin-field admin-field--full"><div class="admin-image-preview" data-image-preview></div></div></div><div class="admin-message" data-product-message></div><div class="admin-actions"><button class="admin-btn admin-btn--secondary" type="button" data-close-product>Cancel</button><button class="admin-btn" type="submit">Save product</button></div></form></div></div></div><a class="admin-home-cross" href="/" aria-label="Back to storefront" title="Back to Storefront">×</a><script type="module" src="../js/admin.js"></script></body></html>
