<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin.css"><title>Categories — Valley Crown Admin</title></head><body class="admin-body" data-admin-page="categories"><div class="admin-shell"><div class="admin-mobile-bar"><button class="admin-menu-btn" data-admin-menu aria-label="Open admin menu">☰</button><div class="wordmark">VALLEY CROWN</div><a href="/" aria-label="Storefront">↗</a></div>
<div class="admin-overlay" data-admin-overlay></div>
<aside class="admin-sidebar" data-admin-sidebar>
  <div class="admin-brand"><div class="wordmark">VALLEY CROWN</div><div class="admin-kicker">Admin Control Centre</div></div>
  <nav class="admin-nav">
    <a data-nav="dashboard" href="/admin/index.html">Dashboard</a>

<main class="admin-main"><div class="admin-top"><div><span class="eyebrow" style="color:#d8c99e">CATALOGUE</span><h1 class="admin-title">Categories.</h1></div><button class="admin-btn" data-new-category>Add category</button></div><div class="admin-card"><div class="admin-toolbar"><input class="admin-input" data-category-search placeholder="Search categories" style="max-width:300px"><span class="admin-mini" data-category-count></span></div><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Name</th><th>Slug</th><th>Status</th><th>Products</th><th>Actions</th></tr></thead><tbody data-categories-list><tr><td colspan="5">Loading…</td></tr></tbody></table></div></div></main><div class="admin-modal hide" data-category-modal><div class="admin-modal__panel" style="max-width:560px"><div class="admin-modal__head"><h2 data-category-modal-title style="font-size:32px">Add category</h2><button class="admin-close" type="button" data-close-category>×</button></div><form data-category-form><input type="hidden" name="id"><div class="admin-form-grid"><div class="admin-field"><label>Name</label><input class="admin-input" name="name" required></div><div class="admin-field"><label>Slug</label><input class="admin-input" name="slug" required></div><div class="admin-field admin-field--full"><label>Status</label><select class="admin-select" name="status"><option value="active">Active</option><option value="inactive">Inactive</option></select></div></div><div class="admin-message" data-category-message></div><div class="admin-actions"><button type="button" class="admin-btn admin-btn--secondary" data-close-category>Cancel</button><button class="admin-btn" type="submit">Save category</button></div></form></div></div></div><a class="admin-home-cross" href="/" aria-label="Back to storefront" title="Back to Storefront">×</a><script type="module" src="../js/admin.js"></script></body></html>
