<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin.css"><title>Orders — Valley Crown Admin</title></head><body class="admin-body" data-admin-page="orders"><div class="admin-shell"><div class="admin-mobile-bar"><button class="admin-menu-btn" data-admin-menu aria-label="Open admin menu">☰</button><div class="wordmark">VALLEY CROWN</div><a href="/" aria-label="Storefront">↗</a></div>
<div class="admin-overlay" data-admin-overlay></div>
<aside class="admin-sidebar" data-admin-sidebar>
  <div class="admin-brand"><div class="wordmark">VALLEY CROWN</div><div class="admin-kicker">Admin Control Centre</div></div>
  <nav class="admin-nav">
    <a data-nav="dashboard" href="/admin/index.html">Dashboard</a>
    <a data-nav="products" href="/admin/products.html">Products</a>
    <a data-nav="categories" href="/admin/categories.html">Categories</a>
    <a data-nav="orders" href="/admin/orders.html">Orders</a>
    <a data-nav="settings" href="/admin/settings.html">Settings</a>
    <a href="/">Storefront ↗</a>
  </nav>
  <div class="admin-sidebar__bottom"><button class="admin-btn admin-btn--secondary" data-logout>Sign out</button></div>
</aside>
<main class="admin-main"><div class="admin-top"><div><span class="eyebrow" style="color:#d8c99e">FULFILMENT</span><h1 class="admin-title">Orders.</h1></div><button class="admin-btn" data-new-order>Add order</button></div><div class="admin-card"><div class="admin-toolbar"><div class="admin-toolbar__group"><input class="admin-input" data-order-search placeholder="Search order/customer/phone" style="max-width:300px"><select class="admin-select" data-order-filter style="width:auto"><option value="all">All status</option><option>New</option><option>Confirmed</option><option>Processing</option><option>Shipped</option><option>Delivered</option><option>Cancelled</option></select></div><span class="admin-mini" data-order-count></span></div><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead><tbody data-orders-list><tr><td colspan="6">Loading…</td></tr></tbody></table></div></div></main><div class="admin-modal hide" data-order-modal><div class="admin-modal__panel"><div class="admin-modal__head"><h2 data-order-modal-title style="font-size:32px">Add order</h2><button class="admin-close" type="button" data-close-order>×</button></div><form data-order-form><input type="hidden" name="id"><div class="admin-form-grid"><div class="admin-field"><label>Order number</label><input class="admin-input" name="order_number" required></div><div class="admin-field"><label>Status</label><select class="admin-select" name="status"><option>New</option><option>Confirmed</option><option>Processing</option><option>Shipped</option><option>Delivered</option><option>Cancelled</option></select></div><div class="admin-field"><label>Customer name</label><input class="admin-input" name="customer_name"></div><div class="admin-field"><label>Phone</label><input class="admin-input" name="phone"></div><div class="admin-field admin-field--full"><label>Address</label><textarea class="admin-textarea" name="address"></textarea></div><div class="admin-field"><label>Total (₹)</label><input class="admin-input" type="number" min="0" step="0.01" name="total" value="0"></div><div class="admin-field"><label>Products / variants summary</label><input class="admin-input" name="items_summary" placeholder="2 × Tee, M, Black"></div><div class="admin-field admin-field--full"><label>Notes</label><textarea class="admin-textarea" name="notes"></textarea></div></div><div class="admin-message" data-order-message></div><div class="admin-actions"><button type="button" class="admin-btn admin-btn--secondary" data-close-order>Cancel</button><button class="admin-btn" type="submit">Save order</button></div></form></div></div></div><a class="admin-home-cross" href="/" aria-label="Back to storefront" title="Back to Storefront">×</a><script type="module" src="../js/admin.js"></script></body></html>
