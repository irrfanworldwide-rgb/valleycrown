<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop Valley Crown</title><meta name="description" content="Explore clothing by category, size, color and price."><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"><link rel="stylesheet" href="css/animations.css"></head><body><div data-component="header"></div><main><section class="page-hero"><div class="container"><span class="eyebrow">The collection</span><h1>Shop all.</h1><p>Modern essentials, textured layers and understated occasion pieces. Discover the current Valley Crown edit.</p></div></section><section class="section"><div class="container"><div class="search-panel"><input class="search-input" data-shop-search placeholder="Search the collection…" aria-label="Search products"></div><div class="shop-layout"><aside class="filters"><div class="filter-group"><strong>Categories</strong><div data-category-filters><span style="font-size:13px;color:var(--muted)">Loading categories…</span></div></div><div class="filter-group"><strong>Availability</strong><label><input type="checkbox" data-stock> In stock only</label></div><div class="filter-group"><strong>Price</strong><label><input type="range" min="500" max="5000" step="100" value="5000" data-price><span data-price-label>Up to ₹5,000</span></label></div></aside><div><div class="sortbar"><span data-result-count>Products</span><select class="select" data-sort><option value="new">Newest</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="sale">Sale</option></select></div><div class="grid product-grid" data-shop-grid></div></div></div></div></section></main><div data-component="footer"></div><div data-component="whatsapp"></div><script type="module" src="js/app.js"></script><script type="module" src="js/shop-page.js"></script></body></html>
